<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Average Location App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background-color: #f9f9f9;
      text-align: center;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
    }
    .output {
      margin-top: 1.5rem;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <h1>Average Location App</h1>
  <p>Group ID: <span id="group-id"></span></p>
  <button id="share-location">Share My Location</button>
  <div class="output">
    <p>Average Latitude: <span id="avg-lat">-</span></p>
    <p>Average Longitude: <span id="avg-lng">-</span></p>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>

  <script type="module">
    // Firebase Configuration (replace with your actual config)
    const firebaseConfig = {
      apiKey: "AIzaSyBsjOURX7bM6OlvgklFC9TwD7czCSjP0PY",
      authDomain: "average-location-app.firebaseapp.com",
      projectId: "average-location-app",
      storageBucket: "average-location-app.firebasestorage.app",
      messagingSenderId: "112355932948",
      appId: "1:112355932948:web:bd11b6ebbb2f538edf6001"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Get location and save it to Firestore
    document.getElementById('share-location').addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(saveLocation, showError);
      } else {
        alert("Geolocation is not supported by this browser.");
      }
    });

    // Save location to Firestore
    function saveLocation(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const timestamp = new Date().toISOString();
      
      // Save to Firestore
      db.collection("locations").add({
        latitude: lat,
        longitude: lng,
        timestamp: timestamp
      })
      .then(() => {
        updateUI(lat, lng);
      })
      .catch((error) => {
        alert("Error saving location: " + error.message);
      });
    }

    // Show error message
    function showError(error) {
      switch(error.code) {
        case error.PERMISSION_DENIED:
          alert("User denied the request for Geolocation.");
          break;
        case error.POSITION_UNAVAILABLE:
          alert("Location information is unavailable.");
          break;
        case error.TIMEOUT:
          alert("The request to get user location timed out.");
          break;
        case error.UNKNOWN_ERROR:
          alert("An unknown error occurred.");
          break;
      }
    }

    // Update UI with the location
    function updateUI(lat, lng) {
      document.getElementById("avg-lat").textContent = lat;
      document.getElementById("avg-lng").textContent = lng;
    }
  </script>
</body>
</html>
